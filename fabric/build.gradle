plugins {
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "touhou-little-maid-mini-fabric-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation project(':core')
    implementation project(':mcp')
    compileOnly fabricApi.module('fabric-gametest-api-v1', fabric_version)
    compileOnly fabricApi.module('fabric-client-gametest-api-v1', fabric_version)
    localRuntime fabricApi.module('fabric-gametest-api-v1', fabric_version)
    localRuntime fabricApi.module('fabric-client-gametest-api-v1', fabric_version)
}

sourceSets {
    main {
        java.srcDir rootProject.file('client/src/main/java')
        resources.srcDir rootProject.file('client/src/main/resources')
    }
}

// core and mcp are plain Java libraries with no Minecraft imports, so their classes
// belong inside the mod jar. Depending on them is not enough: Gradle never packs
// project dependencies into a jar, and Fabric Loader only reads nested jars that are
// themselves mods. Without this the released jar loads and dies on the first
// com.touhoulittlemaid.mini.core reference with NoClassDefFoundError.
configurations {
    bundledLibrary {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    bundledLibrary project(':core')
    bundledLibrary project(':mcp')
}

tasks.named('jar', Jar) {
    // Depending on the configuration makes the jar wait for :core:jar and :mcp:jar;
    // without it Gradle 9 fails the build for using their outputs unannounced.
    dependsOn configurations.bundledLibrary
    from({ configurations.bundledLibrary.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}

// The packaged jar, not the source set, is what users install, so verify the
// bundled packages are actually inside it. Scanning build/libs keeps this
// independent of Loom's internal task names.
tasks.register('verifyPackagedMod') {
    group = 'verification'
    description = 'Fails when the packaged jar is missing the bundled core or mcp classes.'
    dependsOn 'assemble'
    def outputDir = layout.buildDirectory.dir('libs')
    inputs.dir(outputDir)
    doLast {
        def required = ['com/touhoulittlemaid/mini/core/', 'com/touhoulittlemaid/mini/mcp/']
        def jars = fileTree(outputDir) { include '*.jar' }.files.findAll { jar ->
            !jar.name.endsWith('-sources.jar') && !jar.name.endsWith('-javadoc.jar') && !jar.name.endsWith('-dev.jar')
        }
        if (jars.isEmpty()) {
            throw new GradleException("no installable jar was produced in ${outputDir.get().asFile}")
        }
        def archive = jars.sort { it.name }.last()
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def names = zip.entries().collect { it.name }
            required.each { prefix ->
                if (!names.any { it.startsWith(prefix) }) {
                    throw new GradleException(
                            "${archive.name} contains no ${prefix} entries; " +
                                    'the installed mod would fail with NoClassDefFoundError')
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('build') {
    dependsOn 'verifyPackagedMod'
}

def graphicsBackend = providers.gradleProperty('tlmm.graphicsBackend')

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('../run/client')
            vmArg('-Dtlmm.mcp.enabled=true')
            def quickPlay = providers.gradleProperty('tlmm.quickPlay')
            if (quickPlay.present) {
                programArgs '--username', 'Dev', '--quickPlayMultiplayer', quickPlay.get()
            }
            if (graphicsBackend.present) {
                programArgs '--graphicsBackend', graphicsBackend.get()
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('../run/server')
            vmArg('-Dtlmm.mcp.enabled=true')
        }
        gameTestServer {
            inherit server
            setConfigName('Fabric GameTest Server')
            ideConfigGenerated(false)
            runDir('../run/gameTestServer')
            vmArg('-Dfabric-api.gametest')
        }
        clientGametest {
            client()
            setConfigName('Fabric Client GameTest')
            ideConfigGenerated(false)
            runDir('../run/clientGametest')
            vmArg('-Dfabric.client.gametest')
            vmArg("-Dfabric.client.gametest.modid=${mod_id}")
            if (graphicsBackend.present) {
                programArgs '--graphicsBackend', graphicsBackend.get()
            }
        }
    }
}

def langFiles = [
        rootProject.file('client/src/main/resources/assets/tlmm/lang/en_us.json'),
        rootProject.file('client/src/main/resources/assets/tlmm/lang/zh_cn.json')
]

tasks.register('verifyTranslations') {
    group = 'verification'
    description = 'Fails when the English and Chinese language files do not share keys.'
    inputs.files(langFiles)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def english = slurper.parse(langFiles[0])
        def chinese = slurper.parse(langFiles[1])
        def missingInChinese = (english.keySet() - chinese.keySet()).sort()
        def missingInEnglish = (chinese.keySet() - english.keySet()).sort()
        if (!missingInChinese.isEmpty() || !missingInEnglish.isEmpty()) {
            throw new GradleException("Translation keys differ. "
                    + "missing in zh_cn=${missingInChinese}, "
                    + "missing in en_us=${missingInEnglish}")
        }
        logger.lifecycle("Translation keys match: {} keys", english.size())
    }
}

tasks.named('check') {
    dependsOn 'verifyTranslations'
}

processResources {
    def expandProps = [
            version                      : version,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_author                   : mod_author,
            license                      : license,
            minecraft_version            : minecraft_version,
            fabric_minecraft_version_range: fabric_minecraft_version_range,
            fabric_version               : fabric_version,
            fabric_loader_version        : fabric_loader_version,
            java_version                 : java_version
    ]
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand(expandProps)
    }
}
